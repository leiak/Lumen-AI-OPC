{{- if .Values.services.system.enabled }}
{{- $svc := .Values.services.system }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Values.global.namespace | quote }}
  labels:
    {{- include "opc.labels" $ | nindent 4 }}
    app: {{ $svc.name }}
    tier: system
spec:
  type: ClusterIP
  selector:
    app: {{ $svc.name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
      protocol: TCP
{{- end }}