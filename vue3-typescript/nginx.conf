server {
    listen 8079;
    server_name _;

    # SPA fallback: serve index.html for any non-asset path
    root /usr/share/nginx/html;
    index index.html;

    # === Reverse-proxy backend API paths to aiopc-gateway:8080 ===
    # 前端 SPA (RuoYi-Vue 模板) 直接用裸路径调后端 (例: /code /auth/login /system/getInfo /opc/user/info)
    # 所以 nginx 必须把这些路径反代到 gateway,而不是走 SPA fallback 返回 index.html

    # 兼容 /prod-api/ 前缀 (老配置)
    location /prod-api/ {
        proxy_pass http://aiopc-gateway:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 顶层认证端点 (login/logout/code/refresh/register/unlockscreen)
    location ~ ^/(code|login|logout|refresh|register|unlockscreen)$ {
        proxy_pass http://aiopc-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # RuoYi 兼容路径 /auth/**
    location /auth/ {
        proxy_pass http://aiopc-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 系统服务 /system/** /getInfo /getRouters 等顶层端点
    location /system/ {
        proxy_pass http://aiopc-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # OPC 业务路径 /opc/**
    location /opc/ {
        proxy_pass http://aiopc-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;   # AI/agent 接口可能慢
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # RuoYi 单体遗留顶层路径 (/getInfo /getRouters /captchaImage 等)
    location ~ ^/(getInfo|getRouters|captchaImage|captchaImage/[a-f0-9-]+)$ {
        proxy_pass http://aiopc-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # SPA route fallback — 所有未匹配的路径返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
