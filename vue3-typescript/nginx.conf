server {
    listen 8079;
    server_name _;

    # SPA fallback: serve index.html for any non-asset path
    root /usr/share/nginx/html;
    index index.html;

    # === 接口反代 ===
    #
    # 只有 /prod-api/ 反代给 gateway,其余路径一律交回 SPA。
    # 前缀来自 .env.production 的 VITE_APP_BASE_API(= /prod-api),
    # axios 的 baseURL 会自动加上,无需在每个 api/*.ts 里手写。
    #
    # proxy_pass 末尾的斜杠很关键:它会把 /prod-api/ 整段剥掉再转发,
    # gateway 收到的路径与加前缀前完全一致(已实测 /code、/system/**、
    # /opc/** 三组,带不带前缀响应完全一致),所以网关侧不需要任何改动。
    #
    # ⚠️ 不要在这里再加裸路径反代(/opc/、/system/、/auth/ 或顶层正则)。
    # SPA 页面路由和后端接口共用这些前缀:前端页面有 /opc/community/market、
    # /system/user,接口是 /opc/community/module/list、/system/user/getInfo,
    # nginx 无法靠路径区分二者。一旦反代裸路径,浏览器刷新这些页面时发的
    # GET 导航请求(取 HTML 的那个)会被当成接口转给 gateway,
    # 结果就是刷新即白屏 / "Request method 'GET' is not supported"。
    # 加前缀是从根上消除这类撞名,不是绕过。
    location /prod-api/ {
        proxy_pass http://aiopc-gateway:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 所有接口都走这条,超时按最慢的 AI/agent 接口给
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # SPA route fallback — 所有未匹配的路径返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}