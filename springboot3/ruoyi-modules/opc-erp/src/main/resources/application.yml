# OPC ERP 默认配置（Nacos 中可覆盖）
spring:
  main:
    allow-bean-definition-overriding: true
  cloud:
    # Spring Cloud OpenFeign 的 FeignClient 注册跑在 bootstrap 阶段，优先于
    # spring.main.allow-bean-definition-overriding 加载，所以这里必须独立声明。
    allow-bean-definition-overriding: true
  # W72 fix: opc-erp 没用 dynamic-datasource starter,走单数据源 spring.datasource.url
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:aiopc-mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:ry-vue-opc}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:Opc@2026!}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${REDIS_HOST:aiopc-redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:Opc@2026!}

jasypt:
  encryptor:
    password: ${JASYPT_PASSWORD:OpcEncrypt!2026}
    algorithm: PBEWithMD5AndDES

# MyBatis（MybatisConfig 只做 @MapperScan，XML 位置由这里注入）
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ruoyi.opc.erp.domain
  configuration:
    map-underscore-to-camel-case: true

# ERP 业务配置
# OpenFeign 下游服务地址（容器内 Docker DNS 名）
opc:
  erp:
    # OpenFeign downstreams
    notification:
      base-url: http://opc-notification:9310
    ai-core:
      base-url: http://opc-ai-core:9301
    user-center:
      base-url: http://opc-user-center:9302
    # 业务开关
    inventory:
      low-stock-threshold-default: 10
    fifo:
      batch-limit: 100
