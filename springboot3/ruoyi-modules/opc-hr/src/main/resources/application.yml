server:
  port: 9322

spring:
  application:
    name: opc-hr
  profiles:
    active: dev
  cloud:
    # Spring Cloud OpenFeign 的 FeignClient 注册跑在 bootstrap 阶段,优先于
    # spring.main.allow-bean-definition-overriding 加载,所以这里必须独立声明。
    allow-bean-definition-overriding: true
  main:
    allow-bean-definition-overriding: true
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          # Docker 容器里 127.0.0.1 是容器本身,必须用 Docker DNS 名 'mysql'
          url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:ry-vue-opc}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: ${MYSQL_USER:root}
          password: ${MYSQL_PASSWORD:root}
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

  # Spring Boot 3.5: Lettuce 只读 spring.data.redis.* (旧 spring.redis.* 已废弃)
  data:
    redis:
      host: ${REDIS_HOST:aiopc-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Opc@2026!}
      timeout: 10s

jasypt:
  encryptor:
    password: ${JASYPT_PASSWORD:OpcEncrypt!2026}
    algorithm: PBEWithMD5AndDES

# MyBatis (MybatisConfig 只做 @MapperScan, XML 位置由这里注入)
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ruoyi.opc.hr.domain
  configuration:
    map-underscore-to-camel-case: true

# HR 业务配置
# OpenFeign 下游服务地址 (容器内 Docker DNS 名)
opc:
  hr:
    notification:
      base-url: http://opc-notification:9310
    ai-core:
      base-url: http://opc-ai-core:9301
    user-center:
      base-url: http://opc-user-center:9302

logging:
  level:
    com.ruoyi.opc.hr: debug