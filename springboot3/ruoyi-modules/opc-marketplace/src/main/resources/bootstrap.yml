# OPC Marketplace Nacos 配置（服务发现 + 配置中心）
spring:
  cloud:
    nacos:
      # ====== 服务发现 ======
      discovery:
        server-addr: ${NACOS_SERVER:${NACOS_HOST:nacos1}:8848}
        namespace: ${NACOS_NAMESPACE:opc-dev}
        # prod 必须显式开启；fail-fast 后启动失败直接退出
        fail-fast: true
        fail-fast-on-connection-refused: true
      # ====== 配置中心 ======
      config:
        server-addr: ${NACOS_SERVER:${NACOS_HOST:nacos1}:8848}
        namespace: ${NACOS_NAMESPACE:opc-dev}
        file-extension: yml
        fail-fast: true
        fail-fast-on-connection-refused: true
        refresh-enabled: true
        # 重试机制：解决 Nacos 短暂抖动
        retry-time: 3000
        max-retry-time: 60000
  config:
    file-extension: yml
    # Spring Boot 3 / Spring Cloud 2025 下 Nacos 配置必须通过 config.import 拉取
    import:
      - nacos:application-${spring.profiles.active}.${spring.config.file-extension}
      - nacos:${spring.application.name}-${spring.profiles.active}.${spring.config.file-extension}

# 日志
logging:
  level:
    com.ruoyi.opc: debug
    com.alibaba.cloud.nacos: info