# OPC CRM 默认配置（Nacos 中可覆盖）
spring:
  main:
    allow-bean-definition-overriding: true
  cloud:
    # Spring Cloud OpenFeign 的 FeignClient 注册跑在 bootstrap 阶段，优先于
    # spring.main.allow-bean-definition-overriding 加载，所以这里必须独立声明。
    allow-bean-definition-overriding: true
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          # Docker 容器里 127.0.0.1 是容器本身，必须用 Docker DNS 名 'mysql'
          url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:ry-vue-opc}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: ${MYSQL_USER:root}
          password: ${MYSQL_PASSWORD:root}
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

  # Spring Boot 3.5: Lettuce 只读 spring.data.redis.* (旧 spring.redis.* 已废弃)
  data:
    redis:
      host: ${REDIS_HOST:aiopc-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Opc@2026!}
      timeout: 10s

jasypt:
  encryptor:
    password: ${JASYPT_PASSWORD:OpcEncrypt!2026}
    algorithm: PBEWithMD5AndDES

# MyBatis（MybatisConfig 只做 @MapperScan，XML 位置由这里注入）
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ruoyi.opc.crm.domain
  configuration:
    map-underscore-to-camel-case: true

# CRM 业务配置
#
# 原来这里配了三个 OpenFeign 下游地址(notification / ai-core / user-center),三个都用不上:
#   · notification 的 /opc/notification/inbox/push 在对端不存在;
#   · user-center 的 /opc/user-center/user/{id} 在对端不存在(对端是 /opc/user);
#   · ai-core 的 base-url 写的是 http://opc-ai-core:9301,而 compose 里的服务名是
#     aiopc-ai-core;更关键的是 FeignClient 上一旦写了 url,Nacos 服务发现就被绕过去了
#     —— 于是「LLM 评分」按钮点了必然连不上(详见 gateway/AiCoreGateway 的类注释)。
# 现在 AI 评分走 @FeignClient(name = "opc-ai-core", path = "/opc/llm"):
# 只按服务名发现、不写 url,对端端点 POST /opc/llm/chat 是真实存在的。
#
# 「阶段变更 / 新增跟进自动通知」这两个开关从来没有任何代码读它们(对端也没有接收端点),
# 所以一并删掉 —— 留着只会被下一个人当成「这功能已经接好了」。