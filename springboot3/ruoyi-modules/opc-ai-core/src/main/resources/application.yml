# OPC AI 中台默认配置（Nacos 中可覆盖）
spring:
  main:
    allow-bean-definition-overriding: true
  cloud:
    # Spring Cloud OpenFeign 的 FeignClient 注册跑在 bootstrap 阶段,优先于
    # spring.main.allow-bean-definition-overriding 加载,所以这里必须独立声明。
    allow-bean-definition-overriding: true
  # ai-core 自身用 Spring AI 调 LLM provider,但 OpenAI Audio Speech / Transcription
  #  / Image / Moderation 在 OPC 业务中用不到,而且需要 OpenAI key;启动时强制校验
  # 会导致没配 key 直接启动失败。把这些用不到的 Spring AI 配置类排除。
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          # W48.6: dev profile 在 Docker 容器里 127.0.0.1 是容器本身,必须用 Docker DNS 名 'mysql' / 'redis' / 'qdrant'
          url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/ry-vue-opc?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=Asia/Shanghai
          username: ${MYSQL_USER:root}
          password: ${MYSQL_PASSWORD:root}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PWD:}

# Spring AI 配置
# 注: OpenAI API key 必须有非空值(占位即可),否则 OpenAiChatAutoConfiguration 启动时
# 校验失败把整个 context 都拉爆。即使 ai-core 实际用 opc-common 自定义 HTTP 客户端
# 调 DeepSeek/Zhipu,不依赖 Spring AI 的 OpenAiChatModel,这个 Bean 也会被 Spring 加载。
# 所以这里给个 dummy placeholder 让 Bean 装配过。真实 key 通过 OPENAI_API_KEY env 注入。

  # Spring Boot 3.5: Lettuce 只读 spring.data.redis.* (旧 spring.redis.* 已废弃)
  data:
    redis:
      host: ${REDIS_HOST:aiopc-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Opc@2026!}
      timeout: 10s
ai:
  openai:
    api-key: ${OPENAI_API_KEY:sk-placeholder-deepseek}
    base-url: https://api.deepseek.com/v1
    chat:
      options:
        model: deepseek-chat
        temperature: 0.3
    embedding:
      api-key: ${OPENAI_API_KEY:sk-placeholder-deepseek}
    image:
      api-key: ${OPENAI_API_KEY:sk-placeholder-deepseek}
    audio:
      speech:
        api-key: ${OPENAI_API_KEY:sk-placeholder-deepseek}
      transcription:
        api-key: ${OPENAI_API_KEY:sk-placeholder-deepseek}
    moderation:
      api-key: ${OPENAI_API_KEY:sk-placeholder-deepseek}
  zhipuai:
    api-key: ${ZHIPUAI_API_KEY:placeholder}

# LangChain4j
langchain4j:
  chat-model:
    model-name: gpt-4o-mini
    temperature: 0.3
    max-tokens: 2048
    timeout: 60s

# Qdrant 向量数据库
# 端口说明：Qdrant 的 6333 是 REST 口（给 curl / 浏览器用），6334 才是 gRPC。
# Java SDK（io.qdrant:client）只会说 gRPC —— 把端口配成 6333 会连不上，
# 而以前这里写的 6334 是「碰对了」，不是「配对了」。
qdrant:
  host: ${QDRANT_HOST:127.0.0.1}
  port: ${QDRANT_PORT:6334}
  api-key: ${QDRANT_API_KEY:}
  timeout-seconds: 10

# OPC LLM Gateway 配置（W48.6: 多 provider 块）
opc:
  llm:
    primary: MiniMax-Text-01  # MiniMax 优先 (priority=5)
    fallback: deepseek-v3
    enable-cache: true
    cache-ttl: 3600
    max-retries: 3
    timeout-seconds: 60
    # 各 provider 配置（被各 Provider @Component 读取）
    deepseek:
      enabled: false  # W48.6: 用户要求本轮测试只走 MiniMax，临时关
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com/v1
      model: deepseek-chat
    minimax:
      enabled: true
      api-key: ${MINIMAX_API_KEY:}
      base-url: https://api.minimaxi.com/v1
      model: MiniMax-Text-01
      # 向量化模型与聊天模型是两回事：聊天用 MiniMax-Text-01，向量化用 embo-01
      embedding-model: embo-01
      embedding-dimension: 1536
    openai:
      enabled: false
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com/v1
      model: gpt-4o-mini
  memory:
    short-term-ttl: 86400
    long-term-collection: opc_memory
    enable-compression: true
    max-context-tokens: 8000
    # 长期记忆集合的向量维度 —— 必须和 embedding 模型给的维度一致。
    # 不一致时 QdrantVectorStore **不会**自动重建集合（那会清空所有租户的长期记忆），
    # 而是记一条 ERROR 并拒绝这次写入 —— 换向量空间要显式重建。
    vector-dimension: 1536
  agent:
    max-steps: 10
    step-timeout-seconds: 30
    enable-trace: true

# Jasypt 加密
jasypt:
  encryptor:
    password: ${JASYPT_PASSWORD:OpcEncrypt!2026}
    algorithm: PBEWithMD5AndDES

# MyBatis
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ruoyi.opc.ai.domain

# ============================================================
# Actuator / Prometheus 指标
#
# /actuator/prometheus 端点由 micrometer-registry-prometheus 注册
# (依赖见本模块 pom.xml)。Spring Boot 默认不暴露它 —— Prometheus
# 每 15 秒抓到的是 404,7 个 target 全部 down,监控自上线起
# 一个指标都没收到过。
#
# 用白名单而不是 "*":/actuator/env 会把数据源口令、Jasypt 密钥
# 吐出来。业务端口只绑 127.0.0.1、网关也没有 /actuator/** 路由,
# 暴露面仅回环口与容器网。
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
