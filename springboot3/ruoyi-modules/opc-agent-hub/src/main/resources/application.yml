# OPC Agent Hub 默认配置
spring:
  main:
    allow-bean-definition-overriding: true
  # R-15:金额跨服务一跳不能从 BigDecimal 退化成 Double。
  #
  # 工具侧 Feign 声明的是 R<Map<String,Object>> —— 无类型数字,Jackson 默认解成
  # Double,51892.00 一跳就变成 51892.0(精度掉了,scale 也掉了)。
  # 开了这个开关,远端返回的金额保持 BigDecimal,工具再序列化回去时
  # 仍然是 51892.00 —— 「日报里的数字跟库里那行对得上」这句话才立得住。
  #
  # 为什么改本地 application.yml 就够:Nacos 的 opc-dev 下没有
  # opc-agent-hub-dev.yml(那 10 份 dataId 里没有它)→ agent-hub 只吃这份本地配置。
  jackson:
    deserialization:
      use-big-decimal-for-floats: true
  cloud:
    # Spring Cloud OpenFeign 的 FeignClient 注册跑在 bootstrap 阶段,优先于
    # spring.main.allow-bean-definition-overriding 加载,所以这里必须独立声明。
    allow-bean-definition-overriding: true
  # 排除 Spring AI 自动装配（opc-ai-core 间接引入 spring-ai-starter,
  #  但 agent-hub 用的是 opc-common 自定义 LLM 客户端,不需要 Spring AI 自动装配）
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.openai.autoconfigure.OpenAiAutoConfiguration
      - org.springframework.ai.model.zhipuai.autoconfigure.ZhiPuAiChatAutoConfiguration
      - org.springframework.ai.model.zhipuai.autoconfigure.ZhiPuAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.zhipuai.autoconfigure.ZhiPuAiImageAutoConfiguration
      - org.springframework.ai.autoconfigure.zhipuai.ZhiPuAiAutoConfiguration
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
      - org.springframework.ai.autoconfigure.chat.model.ChatModelAutoConfiguration
      - org.springframework.ai.autoconfigure.embedding.EmbeddingModelAutoConfiguration
      - org.springframework.ai.autoconfigure.image.ImageModelAutoConfiguration
      - org.springframework.ai.autoconfigure.tool.ToolAutoConfiguration
      - org.springframework.ai.autoconfigure.chat.client.ChatClientAutoConfiguration
      - org.springframework.ai.autoconfigure.chat.memory.ChatMemoryAutoConfiguration
      - org.springframework.ai.autoconfigure.retry.RetryAutoConfiguration
      - org.springframework.ai.autoconfigure.vector.store.CommonVectorStoreAutoConfiguration
      - org.springframework.ai.autoconfigure.observation.ObservationAutoConfiguration
      - org.springframework.ai.autoconfigure.model.tool.ToolCallingAutoConfiguration
      - org.springframework.ai.autoconfigure.mcp.client.McpClientAutoConfiguration
      - org.springframework.ai.autoconfigure.mcp.server.McpServerAutoConfiguration
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:ry-vue-opc}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=Asia/Shanghai
          username: ${MYSQL_USER:root}
          password: ${MYSQL_PASSWORD:root}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

  # Spring Boot 3.5: Lettuce 只读 spring.data.redis.* (旧 spring.redis.* 已废弃)
  data:
    redis:
      host: ${REDIS_HOST:aiopc-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Opc@2026!}
      timeout: 10s

jasypt:
  encryptor:
    password: ${JASYPT_PASSWORD:OpcEncrypt!2026}

# OPC LLM Gateway 配置
#
# 为什么 agent-hub 也要配 provider:
#   agent-hub 的 @ComponentScan 覆盖 com.ruoyi.opc, 所以 opc-ai-core 的
#   LlmGateway / AgentRuntime / 各 ChatModelProvider 都会在 agent-hub 里成bean。
#   工作流的 LLM 节点 (WorkflowEngine → AgentRuntime → LlmGateway) 是**进程内**
#   调用 provider, 不走 Feign —— 于是 agent-hub 自己就得有一份 provider 配置和凭证。
#
#   以前这里什么都没有 → 所有 provider 的 api-key 都是空 → enabled() 恒为 false
#   → LlmGateway.chat 抛「所有 LLM provider 失败」
#   → **工作流只要带 LLM 节点就必然失败**(定时任务 sys_job 里「财务日报」那条
#     就是这么废的), 也就没有任何用量记录可言 —— 连「漏记」都谈不上, 是压根没调成。
#
#   注意 key 仍然只从环境变量读, 不写进仓库; 缺 key 时 provider 自动 disabled,
#   不会带着假凭证去打 provider。
opc:
  llm:
    # ⚠️ primary / fallback 这两个键**当前没有任何代码读**。
    #   LlmGateway.chat() 是按各 provider 的 priority() **升序**遍历的
    #   (priority 数字小的先试), 某个 provider 全部失败就换下一个 provider。
    #   → 想改「先试谁 / 退到谁」, 改的是各 provider 自己的 priority,
    #     **不是**这两个键 —— 改了这两个键不会有任何效果。
    #   → 读这份文件的人却会以为「改 fallback 就能改降级目标」。
    #     (全仓 grep 这两个键, 只命中一处 javadoc —— 没有任何代码读它们。)
    #   健康检查 26.9 / 26.9b / 26.12 断的是「链真的接上了吗 / 那把钥匙能开门吗」,
    #   26.11 断的是这四份 yml 的这一段还对不对得上。
    primary: MiniMax-Text-01
    fallback: deepseek-v3
    enable-cache: true
    cache-ttl: 3600
    max-retries: 3
    timeout-seconds: 60
    deepseek:
      # 降级链开关：MiniMax 挂掉时退到 DeepSeek。开关闭住在环境变量里 →
      # 改开关不用重建镜像，重启容器即可。
      enabled: ${OPC_LLM_DEEPSEEK_ENABLED:false}
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com/v1
      model: deepseek-chat
    minimax:
      enabled: ${OPC_LLM_MINIMAX_ENABLED:true}
      api-key: ${MINIMAX_API_KEY:}
      base-url: https://api.minimaxi.com/v1
      model: MiniMax-Text-01
      # 向量化模型与聊天模型是两回事：聊天用 MiniMax-Text-01，向量化用 embo-01
      # （值与 MiniMaxEmbeddingProvider 的 @Value 默认值一致，补上是为了让
      #   四份 yml 的 opc.llm 段能逐行对表）
      embedding-model: embo-01
      embedding-dimension: 1536
    openai:
      enabled: false
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com/v1
      model: gpt-4o-mini
  memory:
    short-term-ttl: 86400
    long-term-collection: opc_memory
  agent:
    max-steps: 10
    step-timeout-seconds: 30

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ruoyi.opc.agent.domain

# ============================================================
# Actuator / Prometheus 指标
#
# /actuator/prometheus 端点由 micrometer-registry-prometheus 注册
# (依赖见本模块 pom.xml)。Spring Boot 默认不暴露它 —— Prometheus
# 每 15 秒抓到的是 404,7 个 target 全部 down,监控自上线起
# 一个指标都没收到过。
#
# 用白名单而不是 "*":/actuator/env 会把数据源口令、Jasypt 密钥
# 吐出来。业务端口只绑 127.0.0.1、网关也没有 /actuator/** 路由,
# 暴露面仅回环口与容器网。
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
