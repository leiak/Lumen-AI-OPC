spring:
  application:
    name: ruoyi-system
  config:
    activate:
      on-profile: dev
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: jdbc:mysql://mysql:3306/ry-vue-opc?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: root
          password: Opc@2026!
  data:
    redis:
      host: redis
      port: 6379
      password: Opc@2026!

# ruoyi-system 使用 vanilla MyBatis（非 MyBatis-Plus）
# 同时提供 kebab-case + camelCase 两种属性名（kebab 是 Spring 推荐，camel 是 MybatisProperties 字段名）
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  mapperLocations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ruoyi.system.domain
  typeAliasesPackage: com.ruoyi.system.domain
  typeAliases:
    - com.ruoyi.system.domain.SysDept
    - com.ruoyi.system.domain.SysUser
    - com.ruoyi.system.domain.SysRole
    - com.ruoyi.system.domain.SysDictType
    - com.ruoyi.system.domain.SysDictData
    - com.ruoyi.system.domain.SysLogininfor
    - com.ruoyi.system.domain.SysOperLog
  configuration:
    map-underscore-to-camel-case: true

jasypt:
  encryptor:
    password: OpcEncrypt!2026

# ============================================================
# Actuator / Prometheus 指标
#
# /actuator/prometheus 端点由 micrometer-registry-prometheus 注册
# (依赖见本模块 pom.xml)。Spring Boot 默认不暴露它 —— Prometheus
# 每 15 秒抓到的是 404,7 个 target 全部 down,监控自上线起
# 一个指标都没收到过。
#
# 用白名单而不是 "*":/actuator/env 会把数据源口令、Jasypt 密钥
# 吐出来。业务端口只绑 127.0.0.1、网关也没有 /actuator/** 路由,
# 暴露面仅回环口与容器网。
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
