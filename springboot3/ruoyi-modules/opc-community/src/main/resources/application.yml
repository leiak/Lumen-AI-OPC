# OPC Community 默认配置（Nacos 中可覆盖）
spring:
  main:
    allow-bean-definition-overriding: true
  cloud:
    # Spring Cloud OpenFeign 的 FeignClient 注册跑在 bootstrap 阶段，优先于
    # spring.main.allow-bean-definition-overriding 加载，所以这里必须独立声明。
    allow-bean-definition-overriding: true
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          # Docker 容器里 127.0.0.1 是容器本身，必须用 Docker DNS 名 'mysql'
          url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:ry-vue-opc}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: ${MYSQL_USER:root}
          password: ${MYSQL_PASSWORD:Opc@2026!}
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  # W52 修复中文 mojibake: Jackson default-property-inclusion=non_null
  jackson:
    default-property-inclusion: non_null
  http:
    encoding:
      charset: UTF-8
      force: true

jasypt:
  encryptor:
    password: ${JASYPT_PASSWORD:OpcEncrypt!2026}
    algorithm: PBEWithMD5AndDES

# MyBatis
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ruoyi.opc.community.domain
  configuration:
    map-underscore-to-camel-case: true

# Community 业务配置（容器内 Docker DNS 名）
opc:
  community:
    base-url: http://aiopc-community:9316