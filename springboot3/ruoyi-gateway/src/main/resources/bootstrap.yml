# Tomcat
server:
  port: 8080

# Spring
spring:
  application:
    # 应用名称
    name: ruoyi-gateway
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: ${NACOS_SERVER:nacos1}:8848
        namespace: ${NACOS_NAMESPACE:public}
      config:
        # 配置中心地址
        server-addr: ${NACOS_SERVER:nacos1}:8848
        namespace: ${NACOS_NAMESPACE:public}
    sentinel:
      # 取消控制台懒加载
      eager: true
      # Sentinel 控制台地址。
      #
      # 以前这行是**注释掉的**，理由是「演示栈里没有这个服务」——
      # compose 里确实没有 sentinel,连 8718 端口都不存在,
      # 配一个不存在的地址只会让网关对着空气发心跳。
      #
      # 现在 compose 里有了 aiopc-sentinel-dashboard（deploy/docker-compose.yml），
      # 端口 8718 只绑 127.0.0.1 —— 控制台没有任何鉴权,
      # 谁拿到 URL 谁就能改限流规则, 不该对外暴露。
      #
      # 地址用 compose 的服务名而不是 127.0.0.1: 容器里的 127.0.0.1 是网关自己。
      transport:
        dashboard: ${SENTINEL_DASHBOARD:sentinel-dashboard}:8718
      #
      # 限流规则从 Nacos 持久化 (gw-flow = 网关流控规则)。
      #
      # server-addr 这里原来写的是 127.0.0.1:8848 —— 在容器里那是**网关自己**,
      # Nacos 客户端永远连不上。表现是日志里每秒十几条
      # "Client not connected, current status:STARTING",
      # 而网关的流控规则一条都从来没加载过(仓库里写着「nacos配置持久化」,
      # 实际上那条路是断的)。必须用容器网里的 DNS 名, 和上面 discovery/config 同源。
      datasource:
        ds1:
          nacos:
            server-addr: ${NACOS_SERVER:nacos1}:8848
            namespace: opc-dev
            dataId: sentinel-ruoyi-gateway
            groupId: DEFAULT_GROUP
            data-type: json
            rule-type: gw-flow
  config:
    # 配置文件格式
    file-extension: yml
    import:
      - optional:nacos:application-${spring.profiles.active}.${spring.config.file-extension}
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.config.file-extension}
