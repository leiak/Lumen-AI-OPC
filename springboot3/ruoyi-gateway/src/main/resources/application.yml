# ============================================================
# OPC 网关本地 application.yml
# ============================================================
# 作用:为 ruoyi-gateway 提供本地默认值,作为 Nacos 配置缺失时的
#      fallback。当 Nacos application-{env}.yml 正常加载时,以下
#      内容会被 Nacos 同名配置覆盖(因为 spring.config.import 顺序)。
#
# ⚠️ 注意:此处的 security.ignore.whites 只是安全网,生产环境必须
#    通过 deploy/nacos/apply-whitelist.sh 把 OPC 业务条目
#    推到 Nacos。
# ============================================================

server:
  port: 8080

spring:
  profiles:
    active: dev
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # 自动从 Nacos 注册表为每个 serviceId 创建一条路由
              # 例: ruoyi-system → lb://ruoyi-system
              enabled: true
              lower-case-service-id: true
          routes:
            # === 认证 (login/captcha/logout) — 顶层路径，nginx 不剥前缀 ===
            # 用容器名 aiocrpc-name 直接路由（绕过 lb:// 因为 Nacos 解析有问题）
            - id: ruoyi-auth-login
              uri: http://aiopc-auth:9200
              predicates:
                - Path=/login,/logout,/refresh,/register,/unlockscreen

            # === 认证 (auth/* 兼容路径) ===
            - id: ruoyi-auth
              uri: http://aiopc-auth:9200
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

            # === 系统 (用户/角色/菜单/字典) ===
            # /system/** StripPrefix=1:gateway 去掉 /system 前缀转发给 ruoyi-system
            # (RuoYi 单体时代遗留 /system 前缀,拆分架构下 system controller
            #  直接暴露在 /user /role /menu 等)
            - id: ruoyi-system
              uri: http://aiopc-system:9201
              predicates:
                - Path=/system/**
              filters:
                - StripPrefix=1

            # === OPC 业务服务 ===
            - id: opc-user-center
              uri: http://aiopc-user-center:9302
              predicates:
                - Path=/opc/user/**,/opc/company/**,/opc/invitation/**

            - id: opc-insight
              uri: http://aiopc-insight:9306
              predicates:
                - Path=/opc/insight/**

            - id: opc-agent-hub
              uri: http://aiopc-agent-hub:9303
              predicates:
                - Path=/opc/agent/**

            - id: opc-ai-core
              uri: http://aiopc-ai-core:9301
              predicates:
                - Path=/opc/llm/**

            - id: opc-billing
              uri: http://aiopc-billing:9304
              predicates:
                - Path=/opc/billing/**

            - id: opc-finance
              uri: http://aiopc-finance:9305
              predicates:
                - Path=/opc/finance/**

            # === Notification WebSocket (MUST come BEFORE broader /opc/notification/** route) ===
            # 改写 /opc/notification/ws -> /ws/notification 以匹配后端 WebSocketHandlerRegistry
            # (后端 @RequestMapping 用全路径 /opc/notification/inbox 等,不能 StripPrefix)
            - id: opc-notification-ws
              uri: http://aiopc-notification:9310
              predicates:
                - Path=/opc/notification/ws,/opc/notification/ws/**
              filters:
                - RewritePath=/opc/notification/ws(?<segment>/?.*), /ws/notification$\{segment}

            - id: opc-notification
              uri: http://aiopc-notification:9310
              predicates:
                - Path=/opc/notification/**

security:
  ignore:
    whites:
      # W48.5: 旧版 `/opc/user/invitations/*` 通配会把 /generate 也误放过公网,
      # 导致 SecurityUtils.getUserId() 返回 null,生成邀请失败。
      # 公开端点只剩 2 个:
      #   1) GET  /opc/user/invitations/{code}  公开查邀请人 (落地页)
      #   2) POST /opc/user/invitations/accept   匿名被邀请人接受 (登录后才生效)
      # generate 必须登录 → 移除白名单
      # AntPathMatcher 支持 {name:regex} 语法,8位 base32 = [A-HJ-KM-NP-Z2-9]{8}
      # (排除 I/L/O/0/1,与 OpcCodeGenerator 一致)
      - /opc/user/invitations/accept
      - /opc/user/invitations/{code:[A-HJ-KM-NP-Z2-9]{8}}

      # RuoYi 默认白名单
      - /auth/logout
      - /auth/register
      - /auth/login
      - /auth/smsCode
      - /auth/captchaImage
      - /code
      - /captcha/image
      - /captchaImage
      - /register
      - /social/*
      # OPC 顶层路径白名单（nginx 转发到 gateway 的路径，未带 /auth 前缀）
      - /login
      - /logout
      - /refresh
      - /register
      - /unlockscreen

      # W49: Notification WebSocket — token 在 URL ?token= 里,不走 Authorization 头
      # 必须白名单否则 AuthFilter 报 "令牌不能为空"
      - /opc/notification/ws
      - /opc/notification/ws/**

# 文档参考
logging:
  level:
    com.ruoyi.gateway: info
