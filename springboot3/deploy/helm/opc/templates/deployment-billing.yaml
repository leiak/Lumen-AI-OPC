{{- if .Values.services.billing.enabled }}
{{- $svc := .Values.services.billing }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Values.global.namespace | quote }}
  labels:
    {{- include "opc.labels" $ | nindent 4 }}
    app: {{ $svc.name }}
    tier: business
spec:
  {{- if not $svc.hpa.enabled }}
  replicas: {{ $svc.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml $.Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      app: {{ $svc.name }}
  template:
    metadata:
      labels:
        {{- include "opc.selectorLabels" $ | nindent 8 }}
        app: {{ $svc.name }}
        tier: business
      annotations:
        {{- with $svc.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "opc.serviceAccountName" $ }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $svc.name }}
          image: {{ include "opc.image" (dict "service" $svc "context" $) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          env:
            {{- include "opc.commonEnv" (dict "context" $) | nindent 12 }}
            {{- include "opc.secretEnv" (dict "service" $svc) | nindent 12 }}
            {{- include "opc.jvmOpts" (dict "service" $svc) | nindent 12 }}
            - name: SERVER_PORT
              value: {{ $svc.port | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "opc.fullname" $ }}-common
          {{- with $svc.probes.liveness }}
          livenessProbe:
            httpGet:
              path: {{ .path }}
              port: http
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          {{- with $svc.probes.readiness }}
          readinessProbe:
            httpGet:
              path: {{ .path }}
              port: http
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}