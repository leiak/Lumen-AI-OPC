apiVersion: apps/v1
kind: Deployment
metadata:
  name: opc-ai-core
  namespace: opc
  labels:
    app: opc-ai-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opc-ai-core
  template:
    metadata:
      labels:
        app: opc-ai-core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: opc-ai-core
          image: registry.cn-hangzhou.aliyuncs.com/opc/opc-ai-core:1.0.0
          ports:
            - containerPort: 9301
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opc-ai-secrets
                  key: openai-api-key
            - name: ZHIPUAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opc-ai-secrets
                  key: zhipuai-api-key
            - name: JASYPT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opc-jasypt-secrets
                  key: password
            - name: JAVA_OPTS
              value: "-Xms1g -Xmx2g -XX:+UseG1GC"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9301
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9301
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: opc-ai-core
  namespace: opc
spec:
  selector:
    app: opc-ai-core
  ports:
    - name: http
      port: 9301
      targetPort: 9301
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: opc-ai-core
  namespace: opc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: opc-ai-core
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
