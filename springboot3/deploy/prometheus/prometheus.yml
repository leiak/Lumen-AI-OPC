# ============================================================
# Prometheus 监控配置
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Nacos
  #
  # 路径带 /nacos 前缀：Nacos 的 server.servlet.context-path 就是 /nacos，
  # 所以 actuator 端点在 /nacos/actuator/* 下。
  # 之前这里抓的是默认路径 /metrics —— 那是 Prometheus 自己的路径，
  # Nacos 从来没有这个端点，这个 job 一直是 down。
  # 要真的抓到指标，还得在 nacos/conf/application.properties 里放开
  # management.endpoints.web.exposure.include（默认只暴露 health）。
  - job_name: 'nacos'
    metrics_path: '/nacos/actuator/prometheus'
    static_configs:
      - targets: ['nacos1:8848']

  # OPC 后端服务（通过 Spring Boot Actuator）
  #
  # 走 compose 服务名而不是 host.docker.internal:<port>：
  # 业务端口已收敛到 127.0.0.1（见 docker-compose.yml），宿主机回环口
  # 在容器里是「容器自己」，Prometheus 容器连不到；而所有服务都在
  # aiopc-net 上，用服务名直连容器端口才是对的。
  - job_name: 'opc-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['aiopc-gateway:8080']

  - job_name: 'opc-system'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['aiopc-system:9201']

  - job_name: 'opc-ai-core'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['aiopc-ai-core:9301']

  - job_name: 'opc-user-center'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['aiopc-user-center:9302']

  - job_name: 'opc-agent-hub'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['aiopc-agent-hub:9303']

  - job_name: 'opc-billing'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['aiopc-billing:9304']

  - job_name: 'opc-finance'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['aiopc-finance:9305']

  # MySQL / Redis —— 这两个 job 已删。
  # 宿主机从来没装 mysqld_exporter / redis_exporter,9104 与 9121 上
  # 没有任何东西,target 恒 down,只是让 Prometheus 界面上多两条噪音。
  # 真要接:先把 exporter 加进 compose,再把 target 指向它。

  # RabbitMQ —— management 插件自带 /metrics（容器内 15692），
  # 宿主机没发布这个端口，用服务名直连容器端口。
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  # Qdrant
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
