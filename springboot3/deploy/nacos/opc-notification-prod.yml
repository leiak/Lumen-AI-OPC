# ============================================================
# opc-notification prod 配置
# 命名空间：opc-prod
# DataID：opc-notification-prod.yml
# ------------------------------------------------------------
# ENC(...) 为 Jasypt 占位符。推送 Nacos 前用
#   deploy/nacos/encrypt-secret.sh <明文>
# 生成真实密文替换；仓库里保持占位不落明文。
# ============================================================

server:
  port: 9310

spring:
  application:
    name: opc-notification
  cloud:
    nacos:
      discovery:
        server-addr: opc-nacos-prod:8848
        namespace: opc-prod
        group: DEFAULT_GROUP
        metadata:
          version: 1.0.0
      config:
        server-addr: opc-nacos-prod:8848
        namespace: opc-prod
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:ry-vue-opc}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=Asia/Shanghai
          username: ${MYSQL_USER:root}
          password: ENC(REPLACE_WITH_ENCRYPTED_MYSQL_PASSWORD)
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ENC(REPLACE_WITH_ENCRYPTED_REDIS_PASSWORD)
    timeout: 10s

# 邮件（生产 SMTP，SSL 465）
mail:
  host: ${MAIL_HOST:smtp.aliyun.com}
  port: ${MAIL_PORT:465}
  username: ${MAIL_USER:noreply@opc.com}
  password: ENC(REPLACE_WITH_ENCRYPTED_MAIL_PASSWORD)
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: false
        ssl:
          enable: true

# 通知中心业务配置
opc:
  notification:
    email:
      max-retries: 3
      retry-backoff-ms: 100
    sms:
      provider: aliyun
      sign-name: OPCNOTIFY
      max-retries: 3
      retry-backoff-ms: 100
    aliyun:
      access-key: ENC(REPLACE_WITH_ENCRYPTED_ALIYUN_ACCESS_KEY)
      access-secret: ENC(REPLACE_WITH_ENCRYPTED_ALIYUN_ACCESS_SECRET)

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ruoyi.opc.notification.domain
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.ruoyi.opc.notification: info
