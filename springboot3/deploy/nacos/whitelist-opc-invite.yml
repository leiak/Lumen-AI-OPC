# ============================================================
# OPC 网关白名单 — 推送到 Nacos 的完整片段
# OPC Gateway Whitelist — canonical snippet for Nacos
# ============================================================
# 用途: 由同目录 apply-whitelist.sh 以【并集】方式合并进 Nacos
#      application-{env}.yml 的 security.ignore.whites。
#
# ⚠️ 本文件必须是 ruoyi-gateway/src/main/resources/application.yml
#    里那份白名单的【超集】, 不是子集, 也不是替代品。
#    原因: Spring Cloud 中 Nacos 配置优先级高于 jar 内 application.yml。
#    Nacos 里一旦存在 security.ignore.whites, jar 内那份 fallback 就被
#    整体盖掉 —— 少写一条 = 线上直接少一条, 不会"回落到本地默认值"。
#    改网关白名单时, 两处必须同步修改。
#
# ============================ method 前缀 ============================
# 条目可以带 HTTP method 前缀:
#     GET:/opc/xxx/**    只放行 GET
#     POST:/opc/xxx/**   只放行 POST
#     /opc/xxx/**        放行任意 method (裸条目)
#
# AuthFilter 从 2026-10-24 起支持这个语法 (AuthFilter.java:119 isWhiteListed)。
# 裸条目仍然有效, 但只在"该路径下确实只有读端点"时才用。
#
# ⚠️ 为什么必须加 (2026-10-23 实测的洞):
#    裸条目只按路径匹配, 不区分 method。白名单里为「公开浏览」准备的
#    `/**` 通配, 把同一前缀下的**写端点**也一并放行了 —— 匿名
#    DELETE /opc/erp/product/{id} 能真的删掉商品, PUT /publication/{id}
#    能改别人的商品。收紧前, 共有 23 个写端点对匿名开放。
#
# ⚠️ 冒号左边必须正好是一个 HTTP method 才算前缀。
#    路径本身可以含冒号 (/opc/user/invitations/{code:[A-HJ-KM-NP-Z2-9]{8}}),
#    那种冒号左边是一段路径, 不会被误当成前缀。
# ============================================================

security:
  ignore:
    # ------------------------------------------------------------
    # 移除清单 —— 只被 apply-whitelist.sh 读取, 不会写回 Nacos。
    #
    # 并集合并是【只增不减】的: 条目从本文件里删掉, 它仍然留在 Nacos 上。
    # 下面这些就是历史上删过、但可能还活着的条目:
    #   - /opc/user/invitations/* : W80 换成了两条精确条目, 但并集不会删。
    #     它会放行 POST /opc/user/invitations/generate (正是 W48.5 要堵的口)。
    #   - /test/**, /*/v2|v3/api-docs : RuoYi 基线遗留, 本仓库没有对应 handler。
    #   - /opc/content/script/recent : opc-content 只有 3 个 controller,
    #     没有任何 recent 端点 —— 一条失效条目。
    # ------------------------------------------------------------
    whitesRemove:
      - /opc/user/invitations/*
      - /opc/content/script/recent
      - /test/**
      - /*/v2/api-docs
      - /*/v3/api-docs

    whites:
      # ===== 认证 / 验证码 / 注册 (RuoYi 既有) =====
      # 这批保持裸路径, 不加 method 前缀:
      #   - 它们的 handler 本来就是"匿名可调"的登录类端点, 路径上没有
      #     破坏性操作 (/auth/login POST, /auth/logout DELETE, /auth/register POST)
      #   - /code /captcha/image /captchaImage /social/* 在本仓库里
      #     **根本没有对应 handler** (RuoYi 删掉 ruoyi-admin 的遗留条目)
      #   - 加错 method 前缀会直接把登录搞挂, 收益却接近 0
      - /auth/logout
      - /auth/register
      - /auth/login
      - /auth/smsCode
      - /auth/captchaImage
      - /code
      - /captcha/image
      - /captchaImage
      - /register
      - /social/*
      # ===== 顶层路径 (nginx 不剥前缀, 直达 gateway) =====
      - /login
      - /logout
      - /refresh
      - /register
      - /unlockscreen

      # ===== OPC 邀请落地页 =====
      # GET  /opc/user/invitations/{code} 公开查邀请人 (落地页)
      #   AntPathMatcher 支持 {name:regex} 语法, 8位 base32 = [A-HJ-KM-NP-Z2-9]{8}
      #   (排除 I/L/O/0/1, 与 OpcCodeGenerator 一致)
      - GET:/opc/user/invitations/{code:[A-HJ-KM-NP-Z2-9]{8}}
      # POST /opc/user/invitations/accept 匿名被邀请人接受 (登录后才生效)
      #   —— 这是**有意公开**的写端点, 全表唯一一条。
      #      POST /opc/user/invitations/generate 不在白名单 → 需登录
      #      (曾经的 `/opc/user/invitations/*` 通配会把 generate 也放过公网,
      #       导致 SecurityUtils.getUserId() 返回 null, 生成邀请失败 —— W48.5)
      - POST:/opc/user/invitations/accept

      # ===== Notification WebSocket (W49) =====
      # token 在 URL ?token= 里, 不走 Authorization 头 → 不白名单会报"令牌不能为空"
      # 只有 GET Upgrade 握手这一种用法 (WebSocketConfig 注册 /ws/notification),
      # 后面没有 POST/PUT/DELETE handler。
      - GET:/opc/notification/ws
      - GET:/opc/notification/ws/**

      # ===== Community 公开浏览 (W52) =====
      # 收紧前这三条是裸路径, 于是下面这些**写端点对匿名开放**:
      #   POST   /opc/community/module                创建模块
      #   POST   /opc/community/module/{id}/install   安装模块
      #   POST   /opc/community/comment               发评论
      #   POST   /opc/community/rating                评分
      #   POST   /opc/community/rating/{moduleId}/refresh  刷新评分
      # 现在只放行 GET (公开浏览), 写操作一律要登录。
      - GET:/opc/community/module/list
      - GET:/opc/community/module/**
      - GET:/opc/community/comment
      - GET:/opc/community/rating

      # ===== HR 公开浏览 (W51) =====
      # 收紧前 /opc/hr/job/** 是裸路径 → 7 个写端点匿名可达:
      #   POST /opc/hr/job (创建 JD)  PUT|DELETE /opc/hr/job/{id}
      #   POST /opc/hr/job/{id}/publish|close|pause   POST /opc/hr/job/generate-llm
      - GET:/opc/hr/dashboard
      - GET:/opc/hr/job/list
      - GET:/opc/hr/job/**

      # ===== ERP 公开浏览 (W72) =====
      # 收紧前 /opc/erp/product/** 是裸路径 → 4 个写端点匿名可达:
      #   POST /opc/erp/product (创建)  PUT|DELETE /opc/erp/product/{id}
      #   POST /opc/erp/product/auto-category
      - GET:/opc/erp/product/list
      - GET:/opc/erp/product/**
      - GET:/opc/erp/inventory/low-stock

      # ===== Content 公开浏览 (W74) =====
      # 收紧前 /opc/content/script/** 是裸路径 → 7 个写端点匿名可达:
      #   POST /opc/content/script (创建)  PUT|DELETE /opc/content/script/{id}
      #   POST /opc/content/script/{id}/generate|refine|ready
      #   POST /opc/content/script/adapt
      # 注: /opc/content/script/recent 没有任何 handler (opc-content 只有 3 个
      #     controller), 是一条失效条目, 已删 (见上面的 whitesRemove)。
      - GET:/opc/content/script/list
      - GET:/opc/content/script/dashboard
      - GET:/opc/content/script/**
      - GET:/opc/content/platform-account/list

      # ===== Marketplace 公开浏览 (W80 P1) =====
      # 类目详情用数字正则而非 `**`: 双重保险 ——
      #   1) `**` 会把将来任何 POST/PUT /category/xxx 一并放行
      #   2) method 前缀再把非 GET 的 method 挡在外面
      - GET:/opc/marketplace/category/tree
      - GET:/opc/marketplace/category/list
      - GET:/opc/marketplace/category/{id:[0-9]+}
      - GET:/opc/marketplace/tag/list
      - GET:/opc/marketplace/publication/list
      - GET:/opc/marketplace/publication/search
      # 公开详情仅返回 PUBLISHED (selectPublishedById 在 SQL 层硬过滤)。
      # ⚠️ 这条原来没有 method 前缀 → PUT /publication/{id} (编辑商品) 匿名可达,
      #    只靠 PublicationController.currentAuthorId() → requireCompanyId() 的
      #    400 fail-closed 兜住 —— 去掉那个守卫 = 全网可改任意商品。
      - GET:/opc/marketplace/publication/{id:[0-9]+}
      - GET:/opc/marketplace/review/list/**
      # `[0-9]+` 是必须的: 它保证 "me" 不匹配, 于是 /author/me 仍需登录态。
      # service 层 toPublicVO 已清空 contactEmail / contactPhone / totalRevenue。
      - GET:/opc/marketplace/author/{id:[0-9]+}
      - GET:/opc/marketplace/author/list
      # 注: /publication/my/{id}, /publication/my/list 不加白名单 —— 需校验 author 归属
      # 注: /install/** 全部需登录
