# ============================================================
# opc-crm prod 配置
# 命名空间：opc-prod
# DataID：opc-crm-prod.yml
# ------------------------------------------------------------
# ENC(...) 为 Jasypt 占位符。推送 Nacos 前用
#   deploy/nacos/encrypt-secret.sh <明文>
# 生成真实密文替换；仓库里保持占位不落明文。
# ============================================================

server:
  port: 9312

spring:
  application:
    name: opc-crm
  cloud:
    nacos:
      discovery:
        server-addr: opc-nacos-prod:8848
        namespace: opc-prod
        group: DEFAULT_GROUP
        metadata:
          version: 1.0.0
      config:
        server-addr: opc-nacos-prod:8848
        namespace: opc-prod
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:ry-vue-opc}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=Asia/Shanghai
          username: ${MYSQL_USER:root}
          password: ENC(REPLACE_WITH_ENCRYPTED_MYSQL_PASSWORD)
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ENC(REPLACE_WITH_ENCRYPTED_REDIS_PASSWORD)
    timeout: 10s

# CRM 业务配置
opc:
  crm:
    notification:
      base-url: http://opc-notification:9310
    ai-core:
      base-url: http://opc-ai-core:9301
    user-center:
      base-url: http://opc-user-center:9302
    opportunity:
      auto-notify-on-stage-change: true
      auto-notify-on-new-followup: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ruoyi.opc.crm.domain
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.ruoyi.opc.crm: info