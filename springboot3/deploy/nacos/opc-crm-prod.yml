# ============================================================
# opc-crm prod 配置
# 命名空间：opc-prod
# DataID：opc-crm-prod.yml
# ------------------------------------------------------------
# ENC(...) 为 Jasypt 占位符。推送 Nacos 前用
#   deploy/nacos/encrypt-secret.sh <明文>
# 生成真实密文替换；仓库里保持占位不落明文。
# ============================================================

server:
  port: 9312

spring:
  application:
    name: opc-crm
  cloud:
    nacos:
      discovery:
        server-addr: opc-nacos-prod:8848
        namespace: opc-prod
        group: DEFAULT_GROUP
        metadata:
          version: 1.0.0
      config:
        server-addr: opc-nacos-prod:8848
        namespace: opc-prod
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:ry-vue-opc}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=Asia/Shanghai
          username: ${MYSQL_USER:root}
          password: ENC(REPLACE_WITH_ENCRYPTED_MYSQL_PASSWORD)
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ENC(REPLACE_WITH_ENCRYPTED_REDIS_PASSWORD)
    timeout: 10s

# CRM 业务配置
#
# 原来这里配了三个 OpenFeign 下游地址(notification / ai-core / user-center),三个都用不上:
#   · notification 的 /opc/notification/inbox/push 在对端不存在;
#   · user-center 的 /opc/user-center/user/{id} 在对端不存在(对端是 /opc/user);
#   · ai-core 的 base-url 写的是 http://opc-ai-core:9301,而 compose 里的服务名是
#     aiopc-ai-core;更关键的是 FeignClient 上一旦写了 url,Nacos 服务发现就被绕过去了
#     —— 于是「LLM 评分」按钮点了必然连不上。
# 现在 AI 评分走 @FeignClient(name = "opc-ai-core", path = "/opc/llm"):
# 只按服务名发现、不写 url,对端端点 POST /opc/llm/chat 是真实存在的。
#
# 「阶段变更 / 新增跟进自动通知」这两个开关从来没有任何代码读它们(对端也没有接收端点),
# 所以一并删掉 —— 留着只会被下一个人当成「这功能已经接好了」。

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ruoyi.opc.crm.domain
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.ruoyi.opc.crm: info