# ============================================================
# OPC Content Nacos dev 配置 (W74)
# 端口: 9325
# 命名空间: opc-dev (Spring Cloud 用 namespaceId=opc-dev)
# ============================================================

server:
  port: 9325
  servlet:
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: opc-content
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: jdbc:mysql://${MYSQL_HOST:aiopc-mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:ry-vue-opc}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: ${MYSQL_USER:root}
          password: ${MYSQL_PASSWORD:root}
          driver-class-name: com.mysql.cj.jdbc.Driver

# OPC Content 业务配置 (W74)
opc:
  content:
    # 这里原来还配了三个 OpenFeign 下游地址(notification / ai-core / user-center),三个都用不上:
    #   · 没有任何代码读 opc.content.*.base-url —— Content 的三个 FeignClient
    #     (OpcContentNotificationGateway / OpcContentAiCoreGateway / OpcContentUserCenterGateway)
    #     都只写 name= 不写 url=,走 Nacos 服务发现;
    #   · 而且这些主机名是 compose 里的 DNS 名(aiopc-*),不是 Nacos 里的服务名,
    #     两者混在一起写,迟早有人照着改出一个连不通的地址。
    # 留着只会被下一个人当成「下游地址在这里改」,所以一并删掉。
    #
    # AES-256-GCM token 加密密钥 (32 字节 base64 = "opc-content-aes256-key-32bytes!!")
    token-encryption-key: "b3BjLWNvbnRlbnQtYWVzMjU2LWtleS0zMmJ5dGVzISE="
    # 抖音 OAuth 回调基地址 (前端用于跳转到绑定页面)
    frontend-redirect-base: "http://127.0.0.1:8079/opc/content/platform-account"
    # 平台客户端模式 (dev 用 mock 避免真抖音 sandbox 调用)
    platform:
      mock: true
    # OAuth state 的 HMAC 签名密钥。
    # state 里带着「这次授权属于哪家公司」, 回调时服务端拿不到登录态 ——
    # 密钥只在服务端, 客户端就改不出能通过验签的 companyId。
    # 留空 = 启动时随机生成一把 (单实例可用; 多实例部署必须配固定值,
    # 否则 A 实例签发的 state 到 B 实例验不过)
    oauth:
      state-secret: ""
      state-ttl-seconds: 600
  # 这里原来有一份 llm.scene-mapping(DRAMA/VIDEO/ARTICLE/ADAPTER → scene 名)。
  # 那份映射**没有任何代码读**:scene 名是 Java 里的常量
  # (ContentLlmPrompts.SCENE_SHORT_DRAMA = "content_short_drama" 等),
  # 不是配置出来的。留着会让人以为改这份 YAML 就能换路由 —— 删掉。

# 抖音开放平台 sandbox 配置
douyin:
  client-key: "dev_client_key_placeholder"
  client-secret: "dev_client_secret_placeholder"
  redirect-uri: "http://127.0.0.1:9325/opc/content/oauth/callback"
  api-base: "https://open-sandbox.douyin.com"
  sandbox: true
  scope: "video.create,video.upload,user_info"

mybatis:
  # 与本地 application.yml 一致: **/*.xml 比 *Mapper.xml 宽 ——
  # content 的 4 个 mapper 恰好都以 Mapper.xml 结尾, 两个模式眼下都能命中,
  # 但本地那份才是 jar 里真正生效的真相源, 配置中心这边跟着它走, 别收紧。
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ruoyi.opc.content.domain
  configuration:
    map-underscore-to-camel-case: true

jasypt:
  encryptor:
    password: "OpcEncrypt!2026"

logging:
  level:
    com.ruoyi.opc.content: debug
