# ============================================================
# opc-hr dev 配置
# 命名空间：opc-dev
# DataID：opc-hr-dev.yml
# ============================================================

server:
  port: 9322

spring:
  application:
    name: opc-hr
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          # Docker 容器里 127.0.0.1 是容器本身，必须用 Docker DNS 名 'mysql'
          url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:ry-vue-opc}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: ${MYSQL_USER:root}
          password: ${MYSQL_PASSWORD:root}

jasypt:
  encryptor:
    password: ${JASYPT_PASSWORD:OpcEncrypt!2026}
    algorithm: PBEWithMD5AndDES

# MyBatis (MybatisConfig 只做 @MapperScan, XML 位置由这里注入)
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ruoyi.opc.hr.domain
  configuration:
    map-underscore-to-camel-case: true

# HR 业务配置
#
# 这里原来配了三个 OpenFeign 下游地址(notification / ai-core / user-center),三个都用不上:
#   · 没有任何代码读 opc.hr.*.base-url —— HR 的三个 FeignClient
#     (OpcHrNotificationGateway / OpcHrAiCoreGateway / OpcHrUserCenterGateway)
#     都只写 name= 不写 url=,走 Nacos 服务发现;
#   · 就算有人照着改,这些主机名也是错的:compose 里的服务名是
#     aiopc-notification / aiopc-ai-core / aiopc-user-center,
#     「opc-notification」是 Nacos 里的**服务名**,不是能解析的 DNS 名。
#
# 留着只会被下一个人当成「下游地址在这里改」,所以一并删掉。
opc:
  hr: {}

logging:
  level:
    com.ruoyi.opc.hr: debug
