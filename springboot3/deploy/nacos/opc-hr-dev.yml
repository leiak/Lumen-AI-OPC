# ============================================================
# opc-hr dev 配置
# 命名空间：opc-dev
# DataID：opc-hr-dev.yml
# ============================================================

server:
  port: 9322

spring:
  application:
    name: opc-hr
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          # Docker 容器里 127.0.0.1 是容器本身，必须用 Docker DNS 名 'mysql'
          url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:ry-vue-opc}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: ${MYSQL_USER:root}
          password: ${MYSQL_PASSWORD:root}

jasypt:
  encryptor:
    password: ${JASYPT_PASSWORD:OpcEncrypt!2026}
    algorithm: PBEWithMD5AndDES

# MyBatis (MybatisConfig 只做 @MapperScan, XML 位置由这里注入)
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ruoyi.opc.hr.domain
  configuration:
    map-underscore-to-camel-case: true

# HR 业务配置
opc:
  hr:
    # OpenFeign downstreams
    notification:
      base-url: http://opc-notification:9310
    ai-core:
      base-url: http://opc-ai-core:9301
    user-center:
      base-url: http://opc-user-center:9302

logging:
  level:
    com.ruoyi.opc.hr: debug
