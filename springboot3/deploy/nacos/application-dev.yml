# ============================================================
# OPC 全局配置（Nacos 共享配置 application-dev.yml）
# ============================================================

spring:
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: jdbc:mysql://127.0.0.1:3306/ry-vue-opc?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=Asia/Shanghai
          username: root
          password: root
  # W74.1 修复: Spring Boot 3.2 已移除 spring.redis.* 自动配置,Lettuce 只看 spring.data.redis.*
  data:

jasypt:
  encryptor:
    password: OpcEncrypt!2026
    algorithm: PBEWithMD5AndDES

# OPC 通用
opc:
  llm:
    primary: MiniMax-Text-01
    fallback: deepseek-v3
    enable-cache: true
    cache-ttl: 3600
    max-retries: 3
    timeout-seconds: 60
    # W48.6: dev 本地多 provider（无 key 时 enabled 自动 false）
    deepseek:
      enabled: false  # W48.6: 用户要求本轮测试只走 MiniMax，临时关
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com/v1
      model: deepseek-chat
    minimax:
      enabled: true
      api-key: ${MINIMAX_API_KEY:}
      base-url: https://api.minimaxi.com/v1
      model: MiniMax-Text-01
  memory:
    short-term-ttl: 86400
    long-term-collection: opc_memory
    enable-compression: true
    max-context-tokens: 8000
  agent:
    max-steps: 10
    step-timeout-seconds: 30
    enable-trace: true

# AI 模型 Key（生产请用 Nacos 加密配置）
ai:
  openai:
    api-key: ${OPENAI_API_KEY}
    base-url: https://api.deepseek.com/v1
  zhipuai:
    api-key: ${ZHIPUAI_API_KEY}

langchain4j:
  chat-model:
    model-name: gpt-4o-mini
    temperature: 0.3

qdrant:
  host: 127.0.0.1
  port: 6334
  api-key: ${QDRANT_API_KEY}

# Sentinel 限流
sentinel:
  eager: true
  transport:
    dashboard: 127.0.0.1:8718
  datasource:
    ds1:
      nacos:
        server-addr: 127.0.0.1:8848
        dataId: sentinel-ruoyi-gateway
        groupId: DEFAULT_GROUP
        data-type: json
        rule-type: gw-flow

# 日志
logging:
  level:
    root: info
    com.ruoyi.opc: debug
    dev.langchain4j: info

# SkyWalking Agent
agent:
  service_name: ${spring.application.name}
  collector:
    backend_service: 127.0.0.1:11800

# 监控
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
