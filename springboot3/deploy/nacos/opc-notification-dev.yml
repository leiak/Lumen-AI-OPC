# ============================================================
# opc-notification dev 配置
# 命名空间：opc-dev
# DataID：opc-notification-dev.yml
# ============================================================

server:
  port: 9310

spring:
  application:
    name: opc-notification
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:ry-vue-opc}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: ${MYSQL_USER:root}
          password: ${MYSQL_PASSWORD:root}

# 邮件
#
# 这里原来写的是「dev 指向本地 MailHog / mailpit」, host=smtp.dev.local port=1025,
# 还配了 dev@opc.local / devpass —— **整个演示栈里根本没有邮件服务器**
# (compose 里没有 mailhog / mailpit / maildev, 也没有 MAIL_HOST 环境变量),
# smtp.dev.local 这个域名压根解析不出来。
# 也就是说: 这份配置在替一个不存在的环境作证, 正是这轮要消灭的那类东西。
#
# 现在跟各服务本地 application.yml 逐条一致 —— 演示环境没有邮件服务器,
# 发信就会失败, 这是事实。想接真邮件就配 MAIL_HOST / MAIL_PORT / MAIL_USER /
# MAIL_PASSWORD 四个环境变量, 别在配置里编一台不存在的服务器。
mail:
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:25}
  username: ${MAIL_USER:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: false
        starttls:
          enable: false
        ssl:
          enable: false

# 通知中心业务配置
opc:
  notification:
    email:
      max-retries: 3
      retry-backoff-ms: 100
    sms:
      provider: aliyun
      sign-name: OPCNOTIFY
      max-retries: 3
      retry-backoff-ms: 100
    # 留空 => ProviderConfig 装配 no-op SmsProvider（dev 不真发短信）
    aliyun:
      access-key: ${ALIYUN_ACCESS_KEY:}
      access-secret: ${ALIYUN_ACCESS_SECRET:}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ruoyi.opc.notification.domain
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.ruoyi.opc.notification: debug
