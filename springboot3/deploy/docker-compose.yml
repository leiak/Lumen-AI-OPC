# ============================================================
# AIOPC Docker Compose（开发与公测同栈）
# Stack 名称: aiopc · 所有容器/镜像/网络统一 aiopc-* 前缀
# ============================================================

version: '3.8'

services:
  # ============ Nacos 注册/配置中心（3 节点）============
  nacos1:
    image: nacos/nacos-server:v2.3.2
    container_name: aiopc-nacos-1
    hostname: nacos1
    ports: ["8848:8848", "9848:9848"]
    environment:
      - MODE=standalone
      - NACOS_SERVERS=nacos1:8848
      - NACOS_ENABLE_RPC=true
      - SPRING_DATASOURCE_PLATFORM=mysql
      - NACOS_DATASOURCE_NUM=1
      - NACOS_PREFER_HOST_MODE=hostname
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=ry-vue-opc
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=Opc@2026!
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    volumes:
      - ./nacos/conf:/home/nacos/conf
    networks: [aiopc-net]

  # ============ MySQL 8.0 ============
  mysql:
    image: mysql:8.0
    container_name: aiopc-mysql
    ports: ["3307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: Opc@2026!
      MYSQL_DATABASE: ry-vue-opc
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks: [aiopc-net]

  # ============ Redis 7 ============
  redis:
    image: redis:7.2-alpine
    container_name: aiopc-redis
    ports: ["6379:6379"]
    command: redis-server --appendonly yes --requirepass Opc@2026!
    volumes:
      - ./redis/data:/data
    networks: [aiopc-net]

  # ============ RabbitMQ（Agent 任务队列）============
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: aiopc-rabbitmq
    ports: ["5672:5672", "15672:15672"]
    networks: [aiopc-net]

  # ============ Qdrant 向量库 ============
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: aiopc-qdrant
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - ./qdrant/data:/qdrant/storage
    networks: [aiopc-net]

  # ============ MinIO 对象存储 ============
  minio:
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z
    container_name: aiopc-minio
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: opcadmin
      MINIO_ROOT_PASSWORD: Opc@2026!
    command: server /data --console-address ":9001"
    volumes:
      - ./minio/data:/data
    networks: [aiopc-net]

  # ============ Elasticsearch（日志检索）============
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: aiopc-elasticsearch
    ports: ["9200:9200"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    volumes:
      - ./es/data:/usr/share/elasticsearch/data
    networks: [aiopc-net]

  # ============ Prometheus + Grafana ============
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: aiopc-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks: [aiopc-net]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: aiopc-grafana
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=Opc@2026!
    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks: [aiopc-net]

  # ============ SkyWalking 链路追踪 ============
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: aiopc-skywalking-oap
    ports: ["11800:11800", "12800:12800"]
    networks: [aiopc-net]

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: aiopc-skywalking-ui
    ports: ["8081:8080"]
    environment:
      - SW_OAP_ADDRESS=http://aiopc-skywalking-oap:12800
    depends_on: [skywalking-oap]
    networks: [aiopc-net]

  # ============ AIOPC Insight（AI 数据洞察 MVP）============
  aiopc-insight:
    build:
      context: ..
      dockerfile: ruoyi-modules/opc-insight/Dockerfile
    image: aiopc-insight:latest
    container_name: aiopc-insight
    ports:
      - "9306:9306"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # 覆盖 bootstrap.yml 硬编码的 127.0.0.1:8848
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos1:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos1:8848
      NACOS_NAMESPACE: opc-dev
      JASYPT_PASSWORD: OpcEncrypt!2026
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: ry-vue-opc
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      SERVER_PORT: "9306"
    depends_on:
      - nacos1
      - mysql
      - redis
      - qdrant
    networks:
      - aiopc-net
    restart: unless-stopped

  # ============ Vue3 Frontend (SPA + reverse-proxy) ============
  # Build context = ../../vue3-typescript (resolves relative to deploy/)
  # Dockerfile path is also relative to deploy/
  aiopc-frontend:
    build:
      context: ../../vue3-typescript
      dockerfile: ../springboot3/deploy/Dockerfile.frontend
    image: aiopc-frontend:latest
    container_name: aiopc-frontend
    ports:
      - "8079:8079"
    depends_on:
      - aiopc-gateway
    networks:
      - aiopc-net
    restart: unless-stopped

  # ============ RuoYi Gateway（Spring Cloud Gateway）============
  aiopc-gateway:
    build:
      context: ..
      dockerfile: ruoyi-gateway/Dockerfile
    image: aiopc-gateway:latest
    container_name: aiopc-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos1:8848
      SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: opc-dev
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos1:8848
      SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: opc-dev
      JASYPT_PASSWORD: OpcEncrypt!2026
      SECURITY_CAPTCHA_ENABLED: "true"
      SECURITY_CAPTCHA_TYPE: math
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: Opc@2026!
      SERVER_PORT: "8080"
    depends_on:
      - nacos1
      - mysql
      - redis
    networks:
      - aiopc-net
    restart: unless-stopped

  # ============ RuoYi Auth (login/captcha — /login, /code) ============
  aiopc-auth:
    build:
      context: ..
      dockerfile: ruoyi-auth/Dockerfile
    image: aiopc-auth:latest
    container_name: aiopc-auth
    ports:
      - "19200:9200"  # host 19200 → container 9200 (host 9200 taken by elasticsearch)
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos1:8848
      SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: opc-dev
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos1:8848
      SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: opc-dev
      NACOS_SERVER: nacos1:8848
      NACOS_NAMESPACE: opc-dev
      JASYPT_PASSWORD: OpcEncrypt!2026
      SERVER_PORT: "9200"
      # Redis (required by SysLoginService for captcha + token)
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: Opc@2026!
    depends_on:
      - nacos1
      - redis
    networks:
      - aiopc-net
    restart: unless-stopped

  # ============ RuoYi System（用户/角色/菜单）============
  aiopc-system:
    build:
      context: ..
      dockerfile: ruoyi-modules/ruoyi-system/Dockerfile
    image: aiopc-system:latest
    container_name: aiopc-system
    ports:
      - "9201:9201"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos1:8848
      SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: opc-dev
      SPRING_CLOUD_NACOS_CONFIG_ENABLED: "false"
      JASYPT_PASSWORD: OpcEncrypt!2026
      SERVER_PORT: "9201"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: Opc@2026!
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: Opc@2026!
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: ry-vue-opc
      MYSQL_USER: root
      MYSQL_PASSWORD: Opc@2026!
    depends_on:
      - nacos1
      - mysql
      - redis
    networks:
      - aiopc-net
    restart: unless-stopped

  # ============ OPC User Center（用户中心/邀请/企业）============
  aiopc-user-center:
    build:
      context: ..
      dockerfile: ruoyi-modules/opc-user-center/Dockerfile
    image: aiopc-user-center:latest
    container_name: aiopc-user-center
    ports:
      - "9302:9302"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos1:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos1:8848
      NACOS_NAMESPACE: opc-dev
      JASYPT_PASSWORD: OpcEncrypt!2026
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: ry-vue-opc
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SERVER_PORT: "9302"
    depends_on:
      - nacos1
      - mysql
      - redis
    networks:
      - aiopc-net
    restart: unless-stopped

networks:
  aiopc-net:
    driver: bridge
