  # ============ OPC HR（招聘管理）============
  aiopc-hr:
    build:
      context: ..
      dockerfile: ruoyi-modules/opc-hr/Dockerfile
    image: aiopc-hr:latest
    container_name: aiopc-hr
    ports:
